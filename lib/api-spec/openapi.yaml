openapi: 3.1.0
info:
  title: Api
  version: 0.4.0
  description: "Emergix Academy API contract. Errors use { error: { code, message, details } }. List endpoints use cursor pagination { data, nextCursor }. CSRF is an Origin check (no token header). Better Auth endpoints (/api/auth/*) are not described here. x-required-role is the minimum role (learner < instructor < editor < admin < superadmin). Public site endpoints include exams, courses, FAQs, dates, documents, banners, plans, pages and blog content."
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Liveness and readiness
  - name: bootstrap
    description: One-time, secret-protected setup of the first real administrator account
  - name: account
    description: Signed-in learner's own account (profile, export, deletion)
  - name: admin
    description: Staff-only utilities (phase 03)
  - name: exams
    description: Public exam catalogue
  - name: topics
    description: Taxonomy (public read)
  - name: questions
    description: Question reporting and feedback (learner)
  - name: quizzes
    description: Question-bank sessions
  - name: osce
    description: OSCE stations, attempts, circuits, rooms
  - name: courses
    description: Courses, lessons, video
  - name: progress
    description: Learning progress, notes, certificates
  - name: flashcards
    description: Spaced-repetition flashcards
  - name: planner
    description: Study planner
  - name: analytics
    description: Learner analytics
  - name: billing
    description: Plans, checkout, subscriptions
  - name: webhooks
    description: Inbound provider webhooks
  - name: contact
    description: Contact form
  - name: content
    description: Public CMS content
  - name: admin-dashboard
    description: Admin dashboard
  - name: admin-exams
    description: "Admin: exams"
  - name: admin-questions
    description: "Admin: question manager"
  - name: admin-taxonomy
    description: "Admin: taxonomy"
  - name: admin-osce
    description: "Admin: OSCE station editor"
  - name: admin-courses
    description: "Admin: course builder"
  - name: admin-content
    description: "Admin: CMS"
  - name: admin-users
    description: "Admin: users"
  - name: admin-billing
    description: "Admin: billing"
  - name: admin-support
    description: "Admin: support inbox"
  - name: admin-media
    description: "Admin: media library"
  - name: admin-system
    description: "Admin: audit log, flags, settings, health"
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags:
        - health
      summary: Health check
      description: Returns server health status
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: readinessCheck
      tags:
        - health
      summary: Readiness check
      description: Returns 200 when the server can reach its database, 503 otherwise
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Not ready (database unreachable)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /setup/admin:
    post:
      operationId: bootstrapInitialAdmin
      tags:
        - bootstrap
      summary: Create the one configured administrator account without email verification
      description: Requires the exact configured bootstrap email and a private bootstrap token. Creates at most that one admin account; it does not disable verification for other users.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminBootstrapInput"
      responses:
        "201":
          description: Administrator account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminBootstrapResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Bootstrap token or configured e-mail is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: An account already exists for the configured e-mail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many bootstrap attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Bootstrap is not enabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /exams:
    get:
      operationId: listExams
      tags:
        - exams
      summary: List published exams
      description: Published exams ordered Primary, SBA, OSCE (by sort order).
      responses:
        "200":
          description: Exams
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamList"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
  /exams/{slug}:
    get:
      operationId: getExam
      tags:
        - exams
      summary: Get one exam with its FAQs, dates and documents
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: Exam detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicExamDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
  /exam-dates:
    get:
      operationId: listExamDates
      tags:
        - exams
      summary: Exam dates and fees
      description: Upcoming and recent sittings. Fees are in minor currency units.
      parameters:
        - name: exam
          in: query
          description: Filter by exam slug
          required: false
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamDateList"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
  /exam-dates/calendar.ics:
    get:
      operationId: exportExamCalendar
      tags:
        - exams
      summary: Calendar export (.ics)
      description: Returns text/calendar
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: string
                format: binary
        "429":
          $ref: "#/components/responses/RateLimited"
  /banners:
    get:
      operationId: listActiveBanners
      tags:
        - content
      summary: Active announcement banners
      responses:
        "200":
          description: Banners
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BannerList"
        "429":
          $ref: "#/components/responses/RateLimited"
      security: []
  /topics:
    get:
      operationId: listTopics
      tags:
        - topics
      summary: Topic tree as a flat list (use parentId)
      security: []
      parameters:
        - name: examId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topic"
        "429":
          $ref: "#/components/responses/RateLimited"
  /difficulty-levels:
    get:
      operationId: listDifficultyLevels
      tags:
        - topics
      summary: Difficulty levels
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DifficultyLevel"
        "429":
          $ref: "#/components/responses/RateLimited"
  /questions/{id}/reports:
    post:
      operationId: reportQuestion
      tags:
        - questions
      summary: Report an error in a question
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionReportRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /questions/{id}/flag:
    put:
      operationId: setQuestionFlag
      tags:
        - questions
      summary: Flag or unflag a question
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlagRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlagRequest"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /questions/{id}/note:
    put:
      operationId: setQuestionNote
      tags:
        - questions
      summary: Save my note on a question
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Note"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /free-demo/questions:
    get:
      operationId: listDemoQuestions
      tags:
        - questions
      summary: Limited sample questions without sign-in
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicQuestion"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes:
    post:
      operationId: createQuiz
      tags:
        - quizzes
      summary: Start a Tutor, Timed, Custom or Review session
      description: 403 when the user has no entitlement for the exam. The deadline is computed server-side.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuizRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listQuizzes
      tags:
        - quizzes
      summary: My sessions
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - in_progress
              - completed
              - expired
              - abandoned
      responses:
        "200":
          description: A page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizSessionPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes/{id}:
    get:
      operationId: getQuiz
      tags:
        - quizzes
      summary: Resume a session (questions, saved answers, server time)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes/{id}/questions/{questionId}/answer:
    put:
      operationId: submitAnswer
      tags:
        - quizzes
      summary: Save an answer (autosave, idempotent)
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnswerRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnswerResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes/{id}/finish:
    post:
      operationId: finishQuiz
      tags:
        - quizzes
      summary: Finish a session and compute results
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes/{id}/result:
    get:
      operationId: getQuizResult
      tags:
        - quizzes
      summary: Review results with explanations
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /quizzes/{id}/retry-incorrect:
    post:
      operationId: retryIncorrect
      tags:
        - quizzes
      summary: New session from incorrectly answered questions
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /me/notes:
    get:
      operationId: listMyNotes
      tags:
        - quizzes
      summary: All my notes
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: A page of results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /osce/stations:
    get:
      operationId: listOsceStations
      tags:
        - osce
      summary: List and filter OSCE stations (public; includes "coming soon" topics)
      parameters:
        - name: specialty
          in: query
          required: false
          schema:
            type: string
        - name: topic
          in: query
          required: false
          description: Slug of a specialty or of a topic group.
          schema:
            type: string
        - name: q
          in: query
          required: false
          description: Search in title, topic group and summary.
          schema:
            type: string
            maxLength: 100
        - name: difficulty
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OsceDifficulty"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OsceStationStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 60
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Stations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceStationList"
  /osce/stations/{slug}:
    get:
      operationId: getOsceStation
      tags:
        - osce
      summary: Full station content and marking domains
      parameters:
        - $ref: "#/components/parameters/StationSlug"
      responses:
        "200":
          description: Station
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceStationDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/attempts:
    post:
      operationId: createOsceAttempt
      tags:
        - osce
      summary: Start an attempt (learning or exam mode)
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOsceAttemptRequest"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceAttempt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
    get:
      operationId: listOsceAttempts
      tags:
        - osce
      summary: The caller's saved attempts (self-assessment history), newest first
      parameters:
        - name: stationSlug
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceAttemptList"
  /osce/attempts/{id}:
    patch:
      operationId: updateOsceAttempt
      tags:
        - osce
      summary: Save marks, rating and notes
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOsceAttemptRequest"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceAttempt"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      operationId: deleteOsceAttempt
      tags:
        - osce
      summary: Delete one of the caller's attempts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/circuits:
    post:
      operationId: createOsceCircuit
      tags:
        - osce
      summary: Create a circuit from up to 16 ready stations (reading minute, 8-minute stations, rest stations)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceCircuitCreateInput"
      responses:
        "201":
          description: Created circuit (not started)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitState"
        "400":
          $ref: "#/components/responses/BadRequest"
    get:
      operationId: listOsceCircuits
      tags:
        - osce
      summary: The caller's circuits, newest first
      responses:
        "200":
          description: Circuits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitList"
  /osce/circuits/{id}:
    get:
      operationId: getOsceCircuit
      tags:
        - osce
      summary: Circuit state. Position and remaining time are always derived from the server clock.
      parameters:
        - $ref: "#/components/parameters/CircuitId"
      responses:
        "200":
          description: Circuit state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitState"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/circuits/{id}/advance:
    post:
      operationId: advanceOsceCircuit
      tags:
        - osce
      summary: Move to the next station
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuit"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /osce/rooms:
    post:
      operationId: createOsceRoom
      tags:
        - osce
      summary: Create a partner room; the creator takes the chosen role and shares the link for the other
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceRoomCreateInput"
      responses:
        "201":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceRoomState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
