          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceDraftResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveOsceDraft
      tags:
        - osce
      summary: Autosave the marking sheet (marks, global rating, notes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceMarksInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase06OsceAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: clearOsceDraft
      tags:
        - osce
      summary: Clear marks (deletes the draft)
      responses:
        "204":
          description: Cleared
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/stations/{slug}/attempts:
    post:
      operationId: createOsceStationAttempt
      tags:
        - osce
      summary: Save the marking sheet as a finished attempt (self-assessment history)
      parameters:
        - $ref: "#/components/parameters/StationSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceMarksInput"
      responses:
        "201":
          description: Saved attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase06OsceAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/circuits/{id}/start:
    post:
      operationId: startOsceCircuit
      tags:
        - osce
      summary: Start the circuit clock (once)
      parameters:
        - $ref: "#/components/parameters/CircuitId"
      responses:
        "200":
          description: Started circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitState"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /osce/circuits/{id}/finish:
    post:
      operationId: finishOsceCircuit
      tags:
        - osce
      summary: End the circuit early (marks it abandoned) or confirm completion
      parameters:
        - $ref: "#/components/parameters/CircuitId"
      responses:
        "200":
          description: Finished circuit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitState"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/circuits/{id}/stations/{slug}/marks:
    put:
      operationId: saveOsceCircuitMarks
      tags:
        - osce
      summary: Save marks for one station of a running circuit. Rejected outside the station's marking window.
      parameters:
        - $ref: "#/components/parameters/CircuitId"
        - $ref: "#/components/parameters/StationSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceMarksInput"
      responses:
        "200":
          description: Saved marks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase06OsceAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /osce/circuits/{id}/report:
    get:
      operationId: getOsceCircuitReport
      tags:
        - osce
      summary: Final report with per-station and per-domain scores
      parameters:
        - $ref: "#/components/parameters/CircuitId"
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceCircuitReport"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/rooms/{code}:
    get:
      operationId: getOsceRoom
      tags:
        - osce
      summary: Room state for the caller (role, who has joined, shared clock)
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceRoomState"
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/rooms/{code}/actions:
    post:
      operationId: applyOsceRoomAction
      tags:
        - osce
      summary: Start, pause, resume, skip phase or reset the shared clock (participants only)
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceRoomActionInput"
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceRoomState"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /osce/rooms/{code}/events:
    get:
      operationId: streamOsceRoomEvents
      tags:
        - osce
      summary: Server-Sent Events stream of room state. Used with EventSource, not through generated hooks.
      description: Each `state` event carries an OsceRoomState JSON object personalised for the caller. A comment heartbeat is sent every 25 seconds.
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /osce/rooms/{code}/marks:
    get:
      operationId: getOsceRoomMarks
      tags:
        - osce
      summary: The examiner's autosaved marking sheet for this room
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      responses:
        "200":
          description: Draft (attempt is absent when there is none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OsceDraftResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: saveOsceRoomMarks
      tags:
        - osce
      summary: Autosave the examiner's marks (examiner only)
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceMarksInput"
      responses:
        "200":
          description: Saved draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase06OsceAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      operationId: createOsceRoomAttempt
      tags:
        - osce
      summary: Finalise the examiner's marks as a saved attempt (examiner only)
      parameters:
        - $ref: "#/components/parameters/RoomCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OsceMarksInput"
      responses:
        "201":
          description: Saved attempt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Phase06OsceAttempt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: examplatform.session_token
      description: Session cookie set by Better Auth (served under /api/auth/*, which is not described here).
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Opaque cursor from the previous page's nextCursor
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Search:
      name: q
      in: query
      required: false
      schema:
        type: string
      description: Free-text search
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      description: Unique key per logical payment action; repeated calls return the original result
    Slug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    StationSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
    CircuitId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoomCode:
      name: code
      in: path
      required: true
      schema:
        type: string
  responses:
    ValidationError:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Signed in but not allowed (role, entitlement or CSRF)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict (duplicate or invalid state transition)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimited:
      description: Too many requests
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorBody:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
      required:
        - code
        - message
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    AdminBootstrapInput:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
        - bootstrapToken
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
          writeOnly: true
        bootstrapToken:
          type: string
          minLength: 32
          maxLength: 256
          writeOnly: true
          description: One-time bootstrap secret; never include it in a URL or logs.
    AdminBootstrapResult:
      type: object
      additionalProperties: false
      required:
        - status
        - role
      properties:
        status:
          type: string
          enum: [created]
        role:
          $ref: "#/components/schemas/Role"
    Role:
      type: string
      enum:
        - learner
        - instructor
        - editor
        - admin
        - superadmin
    PublishStatus:
      type: string
      enum:
        - draft
        - published
        - archived
    QuestionStatus:
      type: string
      enum:
        - draft
        - review
        - approved
        - published
        - archived
    DeletedResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        deleted:
          type: boolean
      required:
        - id
        - deleted
    IdResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
        - id
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
        - ok
    DataExportJob:
      type: object
